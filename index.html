<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Red Book Summer Club</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root { --purple:#7B5EA7; --pl:#EDE8F5; --pm:#C4B0E0; --yellow:#FFD93D; --coral:#FF6B6B; --bg:#FFFBF0; --text:#2D2D2D; --soft:#6B6B6B; --bdr:rgba(0,0,0,0.09); --r:16px; --rs:10px; }
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito Sans',sans-serif;background:var(--bg);color:var(--text)}
h1,h2,h3{font-family:'Nunito',sans-serif}
.hdr{background:var(--purple);color:#fff;text-align:center;padding:1.4rem 1rem 2.4rem;position:relative}
.hdr::after{content:'';position:absolute;bottom:-18px;left:0;right:0;height:36px;background:var(--bg);border-radius:50% 50% 0 0/100% 100% 0 0}
.hdr h1{font-size:1.7rem;font-weight:900}
.hdr p{font-size:.83rem;opacity:.72;margin-top:3px}
.stars{font-size:1.1rem;letter-spacing:6px;opacity:.55;margin-bottom:5px}
.wrap{max-width:580px;margin:0 auto;padding:1.5rem 1rem 4rem}
.sec{font-family:'Nunito',sans-serif;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--soft);margin:1.4rem 0 .55rem}
.card{background:#fff;border-radius:var(--r);border:1.5px solid var(--bdr);padding:.95rem 1.05rem;margin-bottom:.55rem;position:relative}
.card.pop{animation:pop .4s ease}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.jbox{background:#fff;border-radius:var(--r);border:2px dashed var(--pm);padding:1.15rem;text-align:center;margin-bottom:1rem;margin-top:.5rem}
.jbox h2{font-size:.97rem;font-weight:800;margin-bottom:3px}
.jbox p{font-size:.8rem;color:var(--soft);margin-bottom:.9rem}
.erow{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-bottom:.9rem}
.ebtn{font-size:1.35rem;background:none;border:2px solid transparent;border-radius:9px;padding:2px 4px;cursor:pointer}
.ebtn.on{border-color:var(--purple);background:var(--pl)}
.frow{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;align-items:center}
input.ti{border:1.5px solid var(--bdr);border-radius:var(--rs);padding:7px 11px;font-size:.88rem;font-family:'Nunito Sans',sans-serif;outline:none;background:var(--bg);color:var(--text);width:138px}
input.ti:focus{border-color:var(--purple)}
.hint{font-size:.73rem;color:var(--soft);margin-top:5px}
.krow{display:flex;align-items:flex-start;gap:9px}
.kemo{font-size:1.9rem;flex-shrink:0;line-height:1;margin-top:1px}
.kinf{flex:1;min-width:0}
.kname{font-size:.97rem;font-weight:800;font-family:'Nunito',sans-serif}
.fbadge{font-size:.68rem;font-weight:700;background:var(--yellow);color:#5a4000;border-radius:99px;padding:2px 7px;margin-left:4px;font-family:'Nunito',sans-serif}
.ksub{font-size:.78rem;color:var(--soft);margin-top:1px}
.stks{font-size:.83rem;margin-top:4px}
.rank{position:absolute;top:9px;right:11px;font-size:1.25rem}
.upd{margin-top:9px;padding-top:9px;border-top:1px solid var(--bdr);display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.upd label{font-size:.8rem;color:var(--soft)}
input.ni{width:62px;border:1.5px solid rgba(0,0,0,.1);border-radius:9px;padding:5px 7px;font-family:inherit;background:#fffbf0;color:#2d2d2d;outline:none;font-size:.87rem}
.srow{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:7px}
.sbtn{font-size:1.25rem;background:var(--bg);border:2px solid transparent;border-radius:7px;padding:2px 5px;cursor:pointer}
.sbtn.on{border-color:var(--purple);background:var(--pl)}
select{border:1.5px solid var(--bdr);border-radius:var(--rs);padding:6px 9px;font-family:'Nunito Sans',sans-serif;font-size:.83rem;background:var(--bg);color:var(--text);outline:none}
.fi{display:flex;align-items:flex-start;gap:7px;font-size:.8rem;color:var(--soft);padding:7px 0;border-bottom:1px solid var(--bdr)}
.fi:last-child{border-bottom:none}
.fi strong{color:var(--text);font-weight:700}
.ft{margin-left:auto;font-size:.7rem;flex-shrink:0;padding-left:6px}
.btn{font-family:'Nunito',sans-serif;font-size:.82rem;font-weight:800;padding:8px 17px;border-radius:99px;border:none;cursor:pointer;white-space:nowrap}
.btn:active{transform:scale(.96)}
.bp{background:var(--purple);color:#fff}
.by{background:var(--yellow);color:#5a4000}
.bg{background:transparent;border:1.5px solid var(--bdr);color:var(--soft);font-family:'Nunito',sans-serif;font-size:.78rem;font-weight:700;padding:5px 12px;border-radius:99px;cursor:pointer}
.sm{font-size:.76rem;padding:5px 12px}
.mbg{display:none;position:fixed;inset:0;background:rgba(40,20,60,.45);z-index:100;align-items:center;justify-content:center;padding:1rem}
.mbg.open{display:flex}
.modal{background:#fff;border-radius:var(--r);padding:1.4rem;max-width:290px;width:100%;text-align:center}
.modal h2{font-size:1.05rem;font-weight:800;margin-bottom:5px;font-family:'Nunito',sans-serif}
.modal p{font-size:.8rem;color:var(--soft);margin-bottom:.9rem}
.dots{display:flex;gap:5px;justify-content:center;margin-bottom:9px}
.dot{width:13px;height:13px;border-radius:50%;border:2px solid var(--pm);background:transparent;transition:background .15s}
.dot.on{background:var(--purple);border-color:var(--purple)}
.np{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;max-width:190px;margin:0 auto 9px}
.nk{font-family:'Nunito',sans-serif;font-size:1.05rem;font-weight:700;background:#fff;border:1.5px solid var(--bdr);border-radius:9px;padding:9px;cursor:pointer;color:var(--text)}
.nk:active{background:var(--pl)}
.perr{color:var(--coral);font-size:.78rem;margin-top:5px;font-weight:600;min-height:1.1em}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--purple);color:#fff;font-family:'Nunito',sans-serif;font-weight:700;font-size:.83rem;padding:7px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:999;white-space:nowrap}
#toast.on{opacity:1}
.pb{height:7px;background:rgba(0,0,0,.07);border-radius:99px;overflow:hidden;margin-top:6px}.pf{height:100%;border-radius:99px;transition:width .5s}.pct{font-size:.7rem;color:var(--soft);margin-top:2px}
.lv-row{display:flex;align-items:center;gap:6px;margin-top:5px}
.lv-label{font-size:.7rem;color:var(--soft);white-space:nowrap;width:80px;flex-shrink:0}
.lv-pct{font-size:.7rem;color:var(--soft);width:28px;text-align:right;flex-shrink:0}
.empty{text-align:center;padding:1.8rem 1rem;color:var(--soft)}
</style>
</head>
<body>

<div class="hdr">
  <div class="stars">★ ★ ★</div>
  <h1>📖 Red Book Summer Club</h1>
</div>

<div class="wrap">
  <div class="jbox">
    <h2>Add your superstar! ⭐</h2>
    <p>Pick an emoji, type your child's name, then create a 4-digit PIN</p>
    <div class="erow" id="erow"></div>
    <div class="frow">
      <input type="text" id="joinName" class="ti" placeholder="Child's name" maxlength="20" />
      <button type="button" class="btn bp sm" id="joinBtn">Join ✓</button>
    </div>
    <div class="hint">You'll create a PIN on the next step</div>
  </div>
  <div id="board"></div>
</div>

<div id="toast"></div>

<div class="mbg" id="pinModal">
  <div class="modal">
    <h2 id="ptitle">Enter PIN</h2>
    <p id="psub">Enter your 4-digit PIN</p>
    <div class="dots">
      <div class="dot" id="d0"></div><div class="dot" id="d1"></div>
      <div class="dot" id="d2"></div><div class="dot" id="d3"></div>
    </div>
    <div class="np" id="np"></div>
    <div class="perr" id="perr"></div>
    <br>
    <button class="bg" id="cancelPin">Cancel</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
var TOTAL=500;
var LEVELS=[
  {min:0,max:100,name:"Seedling",emoji:"🌱"},
  {min:100,max:200,name:"Bookworm",emoji:"📖"},
  {min:200,max:300,name:"Lightning",emoji:"⚡"},
  {min:300,max:400,name:"On Fire",emoji:"🔥"},
  {min:400,max:500,name:"Legend",emoji:"👑"}
];

function getLevel(page){
  for(var i=LEVELS.length-1;i>=0;i--){
    if(page>=LEVELS[i].min)return{level:i+1,data:LEVELS[i]};
  }
  return{level:1,data:LEVELS[0]};
}

var EMOJIS=["🦋","🦁","🌸","🚀","🌈","🐢","🦊","🐸","⚡","🌻","🦄","🐙","🦀","🐝","🌙","🎸","🍎","🦖"];
var STICKERS=["⭐","🎉","🔥","💪","🌟","❤️","👏","🎈","🍀","🐝"];
var COLORS=["#7B5EA7","#4ECDC4","#FF6B6B","#6BCB77","#FFD93D","#F7A072","#A8DADC","#E8A0BF","#90BE6D","#43AA8B","#577590","#F9844A","#4D908E","#277DA1","#F3722C","#F8961E","#F9C74F","#3B6D11"];

var kids=[];
var feedItems=[];
var selEmoji=EMOJIS[0];
var selSticker=STICKERS[0];
var pinBuf="";
var pinCb=null;
var pinMode="verify";
// _pinStep and _pinFirst are managed to prevent Firestore re-renders resetting them
var _pinStep=1;
var _pinFirst="";

function toast(msg){
  var t=document.getElementById("toast");
  t.textContent=msg;t.classList.add("on");
  setTimeout(function(){t.classList.remove("on");},2800);
}

function ago(ts){
  if(!ts)return"";
  var s=Math.floor((Date.now()-ts)/1000);
  if(s<5)return"just now";
  if(s<60)return s+"s ago";
  if(s<3600)return Math.floor(s/60)+"m ago";
  return Math.floor(s/3600)+"h ago";
}

function sid(name){return name.toLowerCase().replace(/[^a-z0-9]/g,"_");}

function pdots(){
  for(var i=0;i<4;i++)document.getElementById("d"+i).classList.toggle("on",i<pinBuf.length);
}

function openPin(mode,cb,name){
  pinMode=mode;pinCb=cb;pinBuf="";_pinStep=1;_pinFirst="";
  document.getElementById("perr").textContent="";
  document.getElementById("ptitle").textContent=mode==="set"?"Create a PIN for "+name:name+"'s PIN";
  document.getElementById("psub").textContent=mode==="set"?"Pick any 4 numbers":"Enter the 4-digit PIN";
  pdots();
  document.getElementById("pinModal").classList.add("open");
}

function closePin(){
  document.getElementById("pinModal").classList.remove("open");
  pinBuf="";pinCb=null;pdots();
}

function pinKey(v){
  if(v==="del"){pinBuf=pinBuf.slice(0,-1);pdots();return;}
  if(pinBuf.length>=4)return;
  pinBuf+=String(v);pdots();
  if(pinBuf.length===4)setTimeout(pinSubmit,200);
}

function pinSubmit(){
  if(pinMode==="set"){
    if(_pinStep===1){
      _pinFirst=pinBuf;pinBuf="";_pinStep=2;
      document.getElementById("psub").textContent="Enter it again to confirm";
      document.getElementById("perr").textContent="";
      pdots();
    } else {
      if(pinBuf===_pinFirst){
        var p=pinBuf;var cb=pinCb;closePin();_pinStep=1;_pinFirst="";if(cb)cb(p);
      } else {
        document.getElementById("perr").textContent="Didn't match — try again";
        pinBuf="";_pinFirst="";_pinStep=1;
        document.getElementById("psub").textContent="Pick any 4 numbers";
        pdots();
      }
    }
  } else {
    var p=pinBuf;var cb=pinCb;closePin();if(cb)cb(p);
  }
}

firebase.initializeApp({
  apiKey:"AIzaSyAzICXHNfqhqBanVi1sapzNS0reryXheF8",
  authDomain:"red-book-club.firebaseapp.com",
  projectId:"red-book-club",
  storageBucket:"red-book-club.firebasestorage.app",
  messagingSenderId:"966866422735",
  appId:"1:966866422735:web:9fb764e2591378082ee0ba"
});
var db=firebase.firestore();

function joinKid(name,emoji,pin){
  var clean=name.trim().slice(0,20);
  var color=COLORS[kids.length%COLORS.length];
  toast("Adding "+clean+"...");
  db.collection("kids").doc(sid(clean)).set({
    name:clean,emoji:emoji,page:0,stickers:[],color:color,pin:pin,
    joinedAt:firebase.firestore.FieldValue.serverTimestamp()
  }).then(function(){
    addFeed("🎉","<strong>"+clean+"</strong> joined the Red Book Summer Club!");
    toast("Welcome, "+clean+"! 🎉");
    document.getElementById("joinName").value="";
  }).catch(function(e){toast("Error: "+e.message);});
}

function updatePage(name,page,pin){
  db.collection("kids").doc(sid(name)).get().then(function(snap){
    if(!snap.exists){toast("Kid not found");return;}
    if(snap.data().pin!==pin){toast("Wrong PIN ❌");return;}
    db.collection("kids").doc(sid(name)).update({page:page}).then(function(){
      addFeed("📖","<strong>"+name+"</strong> is on page "+page+"!");
      // Check for level completion
      LEVELS.forEach(function(lv,li){
        if(page===lv.max){
          addFeed("🎊","🎉✨ <strong>"+name+"</strong> just completed Level "+(li+1)+" — "+lv.emoji+" "+lv.name+"! ✨🎉");
        }
      });
      toast("Saved! 🌟");
      var el=document.getElementById("k_"+sid(name));
      if(el){el.classList.add("pop");setTimeout(function(){el.classList.remove("pop");},500);}
    });
  }).catch(function(e){toast("Error: "+e.message);});
}

function sendSticker(from,to,sticker){
  db.collection("kids").doc(sid(to)).update({
    stickers:firebase.firestore.FieldValue.arrayUnion(sticker)
  }).then(function(){
    addFeed(sticker,"<strong>"+from+"</strong> sent "+sticker+" to <strong>"+to+"</strong>!");
    toast("Sent! "+sticker);
  }).catch(function(e){toast("Error: "+e.message);});
}

function addFeed(emo,html){
  var ref=db.collection("feed").doc("main");
  ref.get().then(function(snap){
    var list=snap.exists?(snap.data().items||[]):[];
    list=[{emo:emo,html:html,ts:Date.now()}].concat(list).slice(0,50);
    ref.set({items:list});
  });
}

function renderBoard(){
  var el=document.getElementById("board");
  if(!el)return;
  var sorted=kids.filter(function(k){return k&&k.name;}).sort(function(a,b){return b.page-a.page;});
  var h='<div style="font-size:.7rem;color:var(--soft);margin-bottom:.4rem">🔴 Live</div>';

  if(sorted.length>0){
    h+='<div class="sec">The superstars · '+sorted.length+' kid'+(sorted.length!==1?'s':'')+'</div>';
    sorted.forEach(function(k,i){
      var rank=k.page>0?(i===0?"🥇":i===1?"🥈":i===2?"🥉":""):"";
      var stks=(k.stickers||[]).slice(-8).join(" ");
      var done=k.page>=TOTAL;
      var id=sid(k.name);
      h+='<div class="card" id="k_'+id+'">';
      if(rank)h+='<div class="rank">'+rank+'</div>';
      h+='<div class="krow"><div class="kemo">'+k.emoji+'</div><div class="kinf">';
      h+='<span class="kname">'+k.name+'</span>';
      if(done)h+='<span class="fbadge">🏆 Finished!</span>';
      h+='<div class="ksub">'+(k.page===0?"Not started yet":"Page "+k.page+" of "+TOTAL)+'</div>';
      if(stks)h+='<div class="stks">'+stks+'</div>';
      // Level bars
      var lv=getLevel(k.page);
      for(var li=0;li<lv.level;li++){
        var lvData=LEVELS[li];
        var lvMin=lvData.min;
        var lvMax=lvData.max;
        var lvFill=li<lv.level-1?100:Math.round(((k.page-lvMin)/(lvMax-lvMin))*100);
        var lvDone=li<lv.level-1;
        var lvColor=lvDone?'#6BCB77':k.color;
        h+='<div class="lv-row">';
        h+='<span class="lv-label">'+lvData.emoji+' '+lvData.name+'</span>';
        h+='<div class="pb" style="flex:1"><div class="pf" style="width:'+lvFill+'%;background:'+lvColor+'"></div></div>';
        h+='<span class="lv-pct">'+lvFill+'%</span>';
        h+='</div>';
      }
      h+='</div></div>';
      h+='<div class="upd"><label>Update page:</label>';
      h+='<input type="number" class="ni" id="pg_'+id+'" min="1" max="'+TOTAL+'" value="'+(k.page||1)+'" />';
      h+='<button class="btn bp sm" data-kid="'+k.name.replace(/"/g,'&quot;')+'">Save 🔑</button>';
      h+='</div></div>';
    });
  } else {
    h+='<div class="empty"><div style="font-size:2.5rem;margin-bottom:6px">📖</div><p>No readers yet — be the first!</p></div>';
  }

  if(sorted.length>0){
    h+='<div class="sec" style="margin-top:1.1rem">Send a sticker</div>';
    h+='<div class="card">';
    h+='<div style="display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:10px">';
    h+='<label style="font-size:.8rem;color:var(--soft)">I am:</label>';
    h+='<select id="senderSel">';
    sorted.forEach(function(k){h+='<option value="'+k.name.replace(/"/g,'&quot;')+'">'+k.emoji+' '+k.name+'</option>';});
    h+='</select></div>';
    h+='<div style="font-size:.8rem;color:var(--soft);margin-bottom:5px">Pick a sticker:</div>';
    h+='<div class="srow">';
    STICKERS.forEach(function(s){
      h+='<button class="sbtn'+(s===selSticker?' on':'')+'" data-s="'+s+'">'+s+'</button>';
    });
    h+='</div><div style="display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:7px">';
    h+='<label style="font-size:.8rem;color:var(--soft)">Send to:</label>';
    h+='<select id="sto">';
    sorted.forEach(function(k){h+='<option value="'+k.name.replace(/"/g,'&quot;')+'">'+k.emoji+' '+k.name+'</option>';});
    h+='</select>';
    h+='<button class="btn by sm" id="sendBtn">Send '+selSticker+'</button>';
    h+='</div></div>';
  }

  if(feedItems.length>0){
    h+='<div class="sec" style="margin-top:1.1rem">Activity</div><div class="card">';
    feedItems.slice(0,12).forEach(function(f){
      h+='<div class="fi"><span style="font-size:.95rem;flex-shrink:0">'+f.emo+'</span><span>'+f.html+'</span><span class="ft">'+ago(f.ts)+'</span></div>';
    });
    h+='</div>';
  }

  el.innerHTML=h;

  // Attach board-level events after innerHTML set
  el.querySelectorAll(".upd button[data-kid]").forEach(function(btn){
    btn.addEventListener("click",function(){
      var name=this.getAttribute("data-kid");
      var pg=parseInt(document.getElementById("pg_"+sid(name)).value);
      if(isNaN(pg)||pg<1||pg>TOTAL){toast("Page must be 1–"+TOTAL);return;}
      var n=name,p=pg;
      openPin("verify",function(pin){updatePage(n,p,pin);},name);
    });
  });

  el.querySelectorAll(".sbtn").forEach(function(btn){
    btn.addEventListener("click",function(){
      selSticker=this.getAttribute("data-s");
      el.querySelectorAll(".sbtn").forEach(function(b){b.classList.remove("on");});
      this.classList.add("on");
      var sb=document.getElementById("sendBtn");
      if(sb)sb.textContent="Send "+selSticker;
    });
  });

  var sendBtn=document.getElementById("sendBtn");
  if(sendBtn){
    sendBtn.addEventListener("click",function(){
      var sel=document.getElementById("sto");
      var senderSel=document.getElementById("senderSel");
      var from=senderSel?senderSel.value:"";
      var to=sel?sel.value:"";
      if(from&&to&&from!==to)sendSticker(from,to,selSticker);
      else if(from===to)toast("You can't send a sticker to yourself!");
      else toast("Pick who you are first!");
    });
  }
}

// Build numpad — runs immediately, pinModal is already in DOM
(function(){
  var np=document.getElementById("np");
  [1,2,3,4,5,6,7,8,9,"",0,"⌫"].forEach(function(v){
    var b=document.createElement("button");
    b.className="nk";
    if(v===""){b.disabled=true;b.style.visibility="hidden";}
    else{
      b.textContent=String(v);
      b.addEventListener("click",function(){pinKey(v==="⌫"?"del":v);});
    }
    np.appendChild(b);
  });
  document.getElementById("cancelPin").addEventListener("click",closePin);
})();

// Build emoji picker — runs immediately, erow is already in DOM
(function(){
  var erow=document.getElementById("erow");
  EMOJIS.forEach(function(emoji){
    var b=document.createElement("button");
    b.className="ebtn"+(emoji===selEmoji?" on":"");
    b.textContent=emoji;
    b.addEventListener("click",function(){
      selEmoji=emoji;
      erow.querySelectorAll(".ebtn").forEach(function(x){x.classList.remove("on");});
      b.classList.add("on");
    });
    erow.appendChild(b);
  });
})();

// Join button — clone first to ensure no duplicate listeners
function setupJoinBtn(){
  var old=document.getElementById("joinBtn");
  var btn=old.cloneNode(true);
  old.parentNode.replaceChild(btn,old);
  btn.addEventListener("click",function(e){
    e.preventDefault();
    var nameEl=document.getElementById("joinName");
    var name=nameEl?nameEl.value.trim():"";
    if(!name){toast("Enter a name first!");return;}
    if(kids.find(function(k){return k.name.toLowerCase()===name.toLowerCase();})){
      toast("That name is already in the club!");return;
    }
    var n=name;
    var ev=selEmoji;
    openPin("set",function(pin){joinKid(n,ev,pin);},n);
  });
}
setupJoinBtn();

// Firebase listeners
db.collection("kids").onSnapshot(function(snap){
  kids=snap.docs.map(function(d){return d.data();});
  renderBoard();
},function(err){toast("Connection error: "+err.message);});

db.collection("feed").doc("main").onSnapshot(function(snap){
  feedItems=snap.exists?(snap.data().items||[]):[];
  renderBoard();
});
</script>
