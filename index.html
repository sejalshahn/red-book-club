<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📖 Red Book Summer Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --yellow: #FFD93D;
    --yellow-dark: #E6C235;
    --purple: #7B5EA7;
    --purple-light: #EDE8F5;
    --purple-mid: #C4B0E0;
    --teal: #4ECDC4;
    --coral: #FF6B6B;
    --green: #6BCB77;
    --bg: #FFFBF0;
    --card: #FFFFFF;
    --text: #2D2D2D;
    --text-soft: #6B6B6B;
    --border: rgba(0,0,0,0.08);
    --radius: 16px;
    --radius-sm: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Nunito Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
  h1, h2, h3, .big { font-family: 'Nunito', sans-serif; }
  .app-header { background: var(--purple); color: white; text-align: center; padding: 1.5rem 1rem 2.5rem; position: relative; overflow: hidden; }
  .app-header::after { content: ''; position: absolute; bottom: -20px; left: 0; right: 0; height: 40px; background: var(--bg); border-radius: 50% 50% 0 0 / 100% 100% 0 0; }
  .app-header h1 { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.5px; }
  .app-header p { font-size: 0.85rem; opacity: 0.75; margin-top: 4px; }
  .stars-deco { font-size: 1.2rem; letter-spacing: 6px; margin-bottom: 6px; opacity: 0.6; }
  .main { max-width: 600px; margin: 0 auto; padding: 1rem 1rem 4rem; }
  .section-title { font-family: 'Nunito', sans-serif; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-soft); margin: 1.5rem 0 0.6rem; }
  .card { background: var(--card); border-radius: var(--radius); border: 1.5px solid var(--border); padding: 1rem 1.1rem; margin-bottom: 0.6rem; position: relative; }
  .card.mine { border-color: var(--purple-mid); background: var(--purple-light); }
  .card.popped { animation: pop 0.4s ease; }
  @keyframes pop { 0%,100%{transform:scale(1)} 50%{transform:scale(1.04)} }
  .kid-card { display: flex; align-items: flex-start; gap: 10px; }
  .kid-emo { font-size: 2rem; flex-shrink: 0; line-height: 1; margin-top: 2px; }
  .kid-info { flex: 1; min-width: 0; }
  .kid-name-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .kid-name { font-family: 'Nunito', sans-serif; font-size: 1rem; font-weight: 800; }
  .finish-badge { display: inline-block; font-family: 'Nunito', sans-serif; font-size: 0.7rem; font-weight: 700; background: var(--yellow); color: #5a4000; border-radius: 99px; padding: 2px 8px; margin-left: 4px; }
  .kid-page-text { font-size: 0.8rem; color: var(--text-soft); margin-top: 2px; }
  .pbar-wrap { margin-top: 7px; }
  .pbar-bg { height: 8px; background: rgba(0,0,0,0.07); border-radius: 99px; overflow: hidden; }
  .pbar-fill { height: 100%; border-radius: 99px; transition: width 0.5s ease; }
  .pct-label { font-size: 0.72rem; color: var(--text-soft); margin-top: 3px; }
  .stickers-received { font-size: 0.85rem; margin-top: 5px; letter-spacing: 1px; }
  .rank-badge { position: absolute; top: 10px; right: 12px; font-size: 1.3rem; line-height: 1; }
  .update-inline { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .update-inline label { font-size: 0.82rem; color: var(--text-soft); }
  .join-box { background: white; border-radius: var(--radius); border: 2px dashed var(--purple-mid); padding: 1.2rem; text-align: center; margin-bottom: 1rem; }
  .join-box h2 { font-size: 1rem; font-weight: 800; margin-bottom: 4px; }
  .join-box p { font-size: 0.82rem; color: var(--text-soft); margin-bottom: 1rem; }
  .emoji-row { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 1rem; }
  .epbtn { font-size: 1.4rem; background: none; border: 2px solid transparent; border-radius: 10px; padding: 3px 5px; cursor: pointer; transition: transform 0.1s, border-color 0.1s; }
  .epbtn:hover { transform: scale(1.15); }
  .epbtn.sel { border-color: var(--purple); background: var(--purple-light); }
  .field-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center; }
  .field-row input[type=text], .field-row input[type=number] {
    border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 8px 12px;
    font-size: 0.9rem; font-family: 'Nunito Sans', sans-serif; outline: none;
    background: var(--bg); color: var(--text); transition: border-color 0.15s;
  }
  .field-row input:focus { border-color: var(--purple); }
  .field-row input[type=text] { width: 140px; }
  .field-row input[type=number] { width: 70px; }
  .pin-hint { font-size: 0.75rem; color: var(--text-soft); margin-top: 6px; }
  .pin-dots { display: flex; gap: 6px; justify-content: center; margin-bottom: 10px; }
  .pin-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--purple-mid); background: transparent; transition: background 0.15s; }
  .pin-dot.filled { background: var(--purple); border-color: var(--purple); }
  .numpad { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; max-width: 200px; margin: 0 auto 10px; }
  .numpad-btn { font-family: 'Nunito', sans-serif; font-size: 1.1rem; font-weight: 700; background: white; border: 1.5px solid var(--border); border-radius: 10px; padding: 10px; cursor: pointer; transition: background 0.1s, transform 0.1s; color: var(--text); }
  .numpad-btn:active { transform: scale(0.94); background: var(--purple-light); }
  .btn { font-family: 'Nunito', sans-serif; font-size: 0.85rem; font-weight: 800; padding: 9px 18px; border-radius: 99px; border: none; cursor: pointer; transition: transform 0.1s, opacity 0.1s; white-space: nowrap; }
  .btn:active { transform: scale(0.96); }
  .btn-primary { background: var(--purple); color: white; }
  .btn-primary:hover { opacity: 0.9; }
  .btn-yellow { background: var(--yellow); color: #5a4000; }
  .btn-ghost { background: transparent; border: 1.5px solid var(--border); color: var(--text-soft); }
  .btn-ghost:hover { border-color: var(--purple-mid); color: var(--purple); }
  .btn-sm { font-size: 0.78rem; padding: 6px 13px; }
  .sticker-row { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 8px; }
  .sbtn { font-size: 1.3rem; background: var(--bg); border: 2px solid transparent; border-radius: 8px; padding: 3px 6px; cursor: pointer; transition: transform 0.1s, border-color 0.1s; }
  .sbtn:hover { transform: scale(1.15); }
  .sbtn.sel { border-color: var(--purple); background: var(--purple-light); }
  .feed-item { display: flex; align-items: flex-start; gap: 8px; font-size: 0.82rem; color: var(--text-soft); padding: 8px 0; border-bottom: 1px solid var(--border); }
  .feed-item:last-child { border-bottom: none; }
  .feed-emo { font-size: 1rem; flex-shrink: 0; margin-top: 1px; }
  .feed-item strong { color: var(--text); font-weight: 700; }
  .feed-time { margin-left: auto; flex-shrink: 0; font-size: 0.72rem; padding-left: 8px; }
  select { border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 7px 10px; font-family: 'Nunito Sans', sans-serif; font-size: 0.85rem; background: var(--bg); color: var(--text); outline: none; }
  select:focus { border-color: var(--purple); }
  .refresh-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.5rem; }
  .last-updated { font-size: 0.72rem; color: var(--text-soft); }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--purple); color: white; font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 0.85rem; padding: 8px 20px; border-radius: 99px; opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 999; white-space: nowrap; }
  #toast.show { opacity: 1; }
  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(40,20,60,0.45); z-index: 100; align-items: center; justify-content: center; padding: 1rem; }
  .modal-bg.open { display: flex; }
  .modal { background: white; border-radius: var(--radius); padding: 1.5rem; max-width: 300px; width: 100%; text-align: center; }
  .modal h2 { font-size: 1.1rem; font-weight: 800; margin-bottom: 6px; }
  .modal p { font-size: 0.82rem; color: var(--text-soft); margin-bottom: 1rem; }
  .error-msg { color: var(--coral); font-size: 0.8rem; margin-top: 6px; font-weight: 600; min-height: 1.2em; }
  .loading { text-align: center; padding: 3rem 1rem; color: var(--text-soft); font-size: 0.9rem; }
  .spinner { font-size: 2rem; animation: spin 1s linear infinite; display: block; margin-bottom: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty { text-align: center; padding: 2rem 1rem; color: var(--text-soft); }
  .syncing { font-size: 0.72rem; color: var(--purple); font-weight: 600; }
</style>
</head>
<body>

<div class="app-header">
  <div class="stars-deco">★ ★ ★</div>
  <h1>📖 Red Book Summer Club</h1>
  <p>Primary Phonics Workbook 1 · 46 pages</p>
</div>

<div class="main" id="main">
  <div class="loading"><span class="spinner">📖</span>Loading the club…</div>
</div>

<div id="toast"></div>

<div class="modal-bg" id="pinModal">
  <div class="modal">
    <h2 id="pinTitle">Enter PIN</h2>
    <p id="pinSubtitle">Enter your 4-digit PIN</p>
    <div class="pin-dots" id="pinDots">
      <div class="pin-dot" id="d0"></div>
      <div class="pin-dot" id="d1"></div>
      <div class="pin-dot" id="d2"></div>
      <div class="pin-dot" id="d3"></div>
    </div>
    <div class="numpad" id="numpad"></div>
    <div class="error-msg" id="pinError"></div>
    <br>
    <button class="btn btn-ghost btn-sm" onclick="closePin()">Cancel</button>
  </div>
</div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, collection, onSnapshot, setDoc, getDoc, updateDoc, arrayUnion, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAzICXHNfqhqBanVi1sapzNS0reryXheF8",
  authDomain: "red-book-club.firebaseapp.com",
  projectId: "red-book-club",
  storageBucket: "red-book-club.firebasestorage.app",
  messagingSenderId: "966866422735",
  appId: "1:966866422735:web:9fb764e2591378082ee0ba"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const TOTAL = 46;
const EMOJIS = ["🦋","🦁","🌸","🚀","🌈","🐢","🦊","🐸","⚡","🌻","🦄","🐙","🦀","🐝","🌙","🎸","🍎","🦖"];
const STICKERS = ["⭐","🎉","🔥","💪","🌟","❤️","👏","🎈","🍀","🐝"];
const COLORS = ["#7B5EA7","#4ECDC4","#FF6B6B","#6BCB77","#FFD93D","#F7A072","#A8DADC","#E8A0BF","#90BE6D","#43AA8B","#577590","#F9844A","#4D908E","#277DA1","#F3722C","#F8961E","#F9C74F","#90BE6D"];

let kids = [];
let feedItems = [];
let selectedEmoji = EMOJIS[0];
let selectedSticker = STICKERS[0];
let pinBuffer = "";
let pinCallback = null;
let pinMode = "verify";
let pinStep = 1;
let pinFirst = "";

// refs
const kidsCol = collection(db, "kids");
const feedDoc = doc(db, "feed", "main");

// ---------- helpers ----------
function timeAgo(ts) {
  if (!ts) return "";
  const ms = ts.toMillis ? ts.toMillis() : ts;
  const s = Math.floor((Date.now() - ms) / 1000);
  if (s < 5) return "just now";
  if (s < 60) return s + "s ago";
  if (s < 3600) return Math.floor(s/60) + "m ago";
  if (s < 86400) return Math.floor(s/3600) + "h ago";
  return Math.floor(s/86400) + "d ago";
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2500);
}

function pop(name) {
  const safe = name.replace(/[^a-zA-Z0-9]/g,"_");
  const el = document.getElementById("kc_" + safe);
  if (el) { el.classList.add("popped"); setTimeout(()=>el.classList.remove("popped"),500); }
}

// ---------- PIN ----------
window.closePin = function() {
  document.getElementById("pinModal").classList.remove("open");
  pinBuffer = ""; pinCallback = null;
  updatePinDots();
}

function openPin(mode, callback, kidName) {
  pinMode = mode; pinCallback = callback; pinBuffer = ""; pinStep = 1; pinFirst = "";
  document.getElementById("pinError").textContent = "";
  if (mode === "set") {
    document.getElementById("pinTitle").textContent = "Create a PIN for " + kidName;
    document.getElementById("pinSubtitle").textContent = "Pick any 4 numbers — this protects " + kidName + "'s page";
  } else {
    document.getElementById("pinTitle").textContent = kidName + "'s PIN";
    document.getElementById("pinSubtitle").textContent = "Enter the 4-digit PIN to save changes";
  }
  updatePinDots();
  document.getElementById("pinModal").classList.add("open");
}

function updatePinDots() {
  for (let i=0;i<4;i++) {
    document.getElementById("d"+i).classList.toggle("filled", i < pinBuffer.length);
  }
}

function buildNumpad() {
  const np = document.getElementById("numpad");
  np.innerHTML = "";
  [1,2,3,4,5,6,7,8,9,"",0,"⌫"].forEach(v => {
    const b = document.createElement("button");
    b.className = "numpad-btn";
    b.textContent = v === "" ? "" : String(v);
    if (v === "") { b.disabled = true; b.style.visibility = "hidden"; }
    b.onclick = () => {
      if (v === "⌫") { pinBuffer = pinBuffer.slice(0,-1); }
      else if (typeof v === "number" && pinBuffer.length < 4) { pinBuffer += String(v); }
      updatePinDots();
      if (pinBuffer.length === 4) setTimeout(submitPin, 180);
    };
    np.appendChild(b);
  });
}

function submitPin() {
  if (pinMode === "set") {
    if (pinStep === 1) {
      pinFirst = pinBuffer; pinBuffer = "";
      document.getElementById("pinSubtitle").textContent = "Enter it again to confirm";
      document.getElementById("pinError").textContent = "";
      updatePinDots(); pinStep = 2;
    } else {
      if (pinBuffer === pinFirst) {
        const pin = pinBuffer;
        window.closePin();
        if (pinCallback) pinCallback(pin);
      } else {
        document.getElementById("pinError").textContent = "PINs didn't match — try again";
        pinBuffer = ""; pinFirst = ""; pinStep = 1;
        document.getElementById("pinSubtitle").textContent = "Pick any 4 numbers";
        updatePinDots();
      }
    }
  } else {
    const pin = pinBuffer;
    window.closePin();
    if (pinCallback) pinCallback(pin);
  }
}

// ---------- Firestore actions ----------
async function joinKid(name, emoji, pin) {
  const clean = name.trim().slice(0,20);
  const ref = doc(db, "kids", clean.toLowerCase().replace(/\s/g,"_"));
  const snap = await getDoc(ref);
  if (snap.exists()) { toast("That name is already in the club!"); return; }
  const color = COLORS[kids.length % COLORS.length];
  await setDoc(ref, { name: clean, emoji, page: 0, stickers: [], color, pin, joinedAt: serverTimestamp() });
  await addFeedItem("🎉", `<strong>${clean}</strong> joined the Red Book Summer Club!`);
  toast("Welcome, " + clean + "! 🎉");
}

async function updatePage(kidName, page, pin) {
  const ref = doc(db, "kids", kidName.toLowerCase().replace(/\s/g,"_"));
  const snap = await getDoc(ref);
  if (!snap.exists()) return;
  if (snap.data().pin !== pin) { toast("Wrong PIN — try again ❌"); return; }
  await updateDoc(ref, { page });
  await addFeedItem("📖", `<strong>${kidName}</strong> is now on page ${page} of ${TOTAL}!`);
  if (page >= TOTAL) await addFeedItem("🏆", `<strong>${kidName}</strong> FINISHED THE WHOLE BOOK! 🎊🎊🎊`);
  toast("Page saved! 🌟"); pop(kidName);
}

async function sendSticker(toName, sticker) {
  const ref = doc(db, "kids", toName.toLowerCase().replace(/\s/g,"_"));
  await updateDoc(ref, { stickers: arrayUnion(sticker) });
  await addFeedItem(sticker, `Someone sent ${sticker} to <strong>${toName}</strong>!`);
  toast("Sticker sent! " + sticker); pop(toName);
}

async function addFeedItem(emo, html) {
  const snap = await getDoc(feedDoc);
  const existing = snap.exists() ? (snap.data().items || []) : [];
  const updated = [{ emo, html, ts: Date.now() }, ...existing].slice(0, 50);
  await setDoc(feedDoc, { items: updated });
}

// ---------- render ----------
function render() {
  const main = document.getElementById("main");
  if (!main) return;
  const sorted = [...kids].sort((a,b) => b.page - a.page);
  let html = "";

  html += `<div class="refresh-bar">
    <span class="last-updated">Live updates on 🔴</span>
    <span class="syncing" id="syncStatus"></span>
  </div>`;

  // Join box
  html += `<div class="join-box">
    <h2>Add your reader! 📚</h2>
    <p>Pick an emoji, type your child's name, then create a 4-digit PIN</p>
    <div class="emoji-row" id="emojiRow">
      ${EMOJIS.map(e=>`<button class="epbtn${e===selectedEmoji?" sel":""}" onclick="pickEmoji('${e}')">${e}</button>`).join("")}
    </div>
    <div class="field-row">
      <input type="text" id="joinName" placeholder="Child's name" maxlength="20" />
      <button class="btn btn-primary btn-sm" onclick="doJoin()">Join ✓</button>
    </div>
    <div class="pin-hint">You'll create a PIN on the next step</div>
  </div>`;

  // Kid cards
  if (sorted.length > 0) {
    html += `<div class="section-title">The readers · ${sorted.length} kid${sorted.length!==1?"s":""}</div>`;
    sorted.forEach((k, idx) => {
      const pct = Math.round((k.page / TOTAL) * 100);
      const rank = k.page > 0 ? (idx===0?"🥇":idx===1?"🥈":idx===2?"🥉":"") : "";
      const recentStickers = (k.stickers||[]).slice(-8).join(" ");
      const finished = k.page >= TOTAL;
      const safe = k.name.replace(/[^a-zA-Z0-9]/g,"_");
      html += `<div class="card" id="kc_${safe}">
        ${rank?`<div class="rank-badge">${rank}</div>`:""}
        <div class="kid-card">
          <div class="kid-emo">${k.emoji}</div>
          <div class="kid-info">
            <div class="kid-name-row">
              <span class="kid-name">${k.name}</span>
              ${finished?`<span class="finish-badge">🏆 Finished!</span>`:""}
            </div>
            <div class="kid-page-text">${k.page===0?"Not started yet":`Page ${k.page} of ${TOTAL}`}</div>
            <div class="pbar-wrap">
              <div class="pbar-bg"><div class="pbar-fill" style="width:${pct}%;background:${k.color}"></div></div>
              <div class="pct-label">${pct}% done</div>
            </div>
            ${recentStickers?`<div class="stickers-received">${recentStickers}</div>`:""}
          </div>
        </div>
        <div class="update-inline">
          <label>Update page:</label>
          <input type="number" id="pg_${safe}" min="1" max="${TOTAL}" value="${k.page||1}" style="width:64px;border:1.5px solid rgba(0,0,0,0.1);border-radius:10px;padding:6px 8px;font-family:inherit;background:#fffbf0;color:#2d2d2d;outline:none" />
          <button class="btn btn-primary btn-sm" onclick="doUpdate('${k.name.replace(/'/g,"\\'")}')">Save 🔑</button>
        </div>
      </div>`;
    });
  } else {
    html += `<div class="empty"><div style="font-size:3rem;margin-bottom:8px">📖</div><p>No readers yet — be the first to join!</p></div>`;
  }

  // Sticker sender
  if (sorted.length > 0) {
    html += `<div class="section-title" style="margin-top:1.2rem">Send a sticker</div>
    <div class="card">
      <div style="font-size:0.82rem;color:var(--text-soft);margin-bottom:6px;">Pick one:</div>
      <div class="sticker-row">
        ${STICKERS.map(s=>`<button class="sbtn${s===selectedSticker?" sel":""}" onclick="pickSticker('${s}')">${s}</button>`).join("")}
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;">
        <label style="font-size:0.82rem;color:var(--text-soft);">Send to:</label>
        <select id="stickerTo">${sorted.map(k=>`<option value="${k.name}">${k.emoji} ${k.name}</option>`).join("")}</select>
        <button class="btn btn-yellow btn-sm" onclick="doSendSticker()">Send ${selectedSticker}</button>
      </div>
    </div>`;
  }

  // Feed
  if (feedItems.length > 0) {
    html += `<div class="section-title" style="margin-top:1.2rem">Activity</div>
    <div class="card">
      ${feedItems.slice(0,15).map(f=>`
        <div class="feed-item">
          <span class="feed-emo">${f.emo}</span>
          <span>${f.html}</span>
          <span class="feed-time">${timeAgo({toMillis:()=>f.ts})}</span>
        </div>`).join("")}
    </div>`;
  }

  main.innerHTML = html;
}

// ---------- global event handlers ----------
window.pickEmoji = (e) => { selectedEmoji = e; render(); };
window.pickSticker = (s) => { selectedSticker = s; render(); };

window.doJoin = async () => {
  const nameEl = document.getElementById("joinName");
  if (!nameEl) return;
  const name = nameEl.value.trim();
  if (!name) { toast("Enter a name first!"); return; }
  if (kids.find(k=>k.name.toLowerCase()===name.toLowerCase())) { toast("That name is already in the club!"); return; }
  openPin("set", (pin) => joinKid(name, selectedEmoji, pin), name);
};

window.doUpdate = (name) => {
  const safe = name.replace(/[^a-zA-Z0-9]/g,"_");
  const el = document.getElementById("pg_" + safe);
  if (!el) return;
  const p = parseInt(el.value);
  if (isNaN(p) || p < 1 || p > TOTAL) { toast("Page must be 1–" + TOTAL); return; }
  openPin("verify", (pin) => updatePage(name, p, pin), name);
};

window.doSendSticker = () => {
  const sel = document.getElementById("stickerTo");
  if (sel) sendSticker(sel.value, selectedSticker);
};

// ---------- real-time listeners ----------
buildNumpad();

// Listen to kids collection
onSnapshot(kidsCol, (snap) => {
  kids = snap.docs.map(d => d.data());
  render();
});

// Listen to feed
onSnapshot(feedDoc, (snap) => {
  if (snap.exists()) feedItems = snap.data().items || [];
  render();
});

</script>
</body>
